name: Deploy to Hong Kong

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.HK_HOST }}
      SSH_PORT: ${{ secrets.HK_PORT || '38122' }}
      SSH_USER: ${{ secrets.HK_USER }}
      SITE_DOMAIN: canvas.usetoken.org

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Build frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HK_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HK_SSH_KNOWN_HOSTS }}
        run: |
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret for $name." >&2
              exit 1
            fi
          done

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        shell: bash
        env:
          REVISION: ${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/infinite-canvas-$REVISION.tar.gz"
          remote_archive="/tmp/infinite-canvas-$REVISION.tar.gz"
          tar -C web/dist -czf "$archive" .

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 -P "$SSH_PORT" \
            "$archive" "$SSH_USER@$SSH_HOST:$remote_archive"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$REVISION' '$remote_archive' '/var/www/infinite-canvas' '$SITE_DOMAIN'" \
            < scripts/deploy-static.sh
